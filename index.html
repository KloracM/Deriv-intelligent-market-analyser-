<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1d">
<title>Deriv Intelligent Market Analyser V3</title>

<style>
:root{
--bg:#080f1d;
--panel:#111e32;
--panel2:#192943;
--line:#30435e;
--text:#edf5ff;
--muted:#91a5c0;
--cyan:#00e5ff;
--green:#00e69a;
--red:#ff5b75;
--gold:#ffd166;
--purple:#b69aff;
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(ellipse at top,#183653,#080f1d 55%);
color:var(--text);
font-family:Arial,sans-serif;
padding-bottom:90px;
}

header{
position:sticky;
top:0;
z-index:10;
background:#091525ee;
border-bottom:1px solid var(--line);
padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(12px);
}

.logo{
font-weight:900;
letter-spacing:1px;
color:var(--cyan);
}

.logo span{color:white}

.status{
font-size:10px;
font-weight:bold;
color:var(--gold);
}

.container{
max-width:1400px;
margin:auto;
padding:12px;
}

.panel{
background:linear-gradient(145deg,#13233a,#0e192a);
border:1px solid var(--line);
border-radius:14px;
padding:14px;
margin-bottom:12px;
}

h2{
font-size:13px;
color:var(--cyan);
letter-spacing:.8px;
margin:0 0 13px;
}

h3{
font-size:10px;
color:var(--muted);
margin:0 0 7px;
}

select,input,button{
background:var(--panel2);
color:white;
border:1px solid var(--line);
border-radius:9px;
padding:12px;
font-size:13px;
}

select,input{width:100%}

button{
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.primary{
background:linear-gradient(110deg,#007bb5,#00b9c9);
border:0;
}

.danger{background:#582238}

.secondary{background:#253a58}

.market-row{
display:grid;
grid-template-columns:1.5fr 1fr;
gap:12px;
}

.button-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:9px;
}

.metric{
background:var(--panel2);
padding:11px;
border-radius:9px;
min-width:0;
}

.metric small{
font-size:9px;
color:var(--muted);
}

.metric strong{
display:block;
font-size:18px;
margin-top:6px;
overflow-wrap:anywhere;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
align-items:center;
gap:8px;
}

.hero-digit{text-align:center}

.big-digit{
font-size:clamp(90px,20vw,150px);
font-weight:900;
color:var(--cyan);
text-shadow:0 0 22px #00e5ff88;
line-height:1.1;
min-height:1.1em;
}

.pop{animation:pop .25s ease}

@keyframes pop{
0%{transform:scale(.6);opacity:.4}
75%{transform:scale(1.15)}
100%{transform:scale(1);opacity:1}
}

.digits{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
}

.digit{
background:var(--panel2);
border:1px solid var(--line);
border-radius:9px;
padding:9px 3px;
text-align:center;
}

.digit b{font-size:22px}

.digit small{
display:block;
color:var(--muted);
font-size:9px;
margin-top:4px;
}

.digit.hot{border-color:var(--green)}
.digit.cold{border-color:var(--red)}

.bar{
height:4px;
border-radius:5px;
background:#30425c;
margin-top:7px;
overflow:hidden;
}

.bar i{
display:block;
height:100%;
background:linear-gradient(90deg,#007cb7,var(--cyan));
}

.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.predictions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.prediction{
background:var(--panel2);
border-radius:9px;
text-align:center;
padding:12px 4px;
}

.prediction strong{
display:block;
color:var(--cyan);
font-size:20px;
margin:8px 0;
}

.prediction small{
font-size:9px;
color:var(--muted);
}

.result{
background:#091525;
border:1px solid var(--line);
border-radius:9px;
padding:11px;
margin-top:9px;
font-size:12px;
line-height:1.7;
overflow-wrap:anywhere;
}

.muted{color:var(--muted);font-size:10px}
.green{color:var(--green)}
.red{color:var(--red)}
.gold{color:var(--gold)}
.cyan{color:var(--cyan)}

table{
border-collapse:collapse;
width:100%;
font-size:10px;
}

td,th{
padding:8px 5px;
border-bottom:1px solid var(--line);
text-align:left;
}

th{color:var(--cyan)}

.scroll{overflow-x:auto}

.dock{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:20;
background:#081321ee;
border-top:1px solid var(--line);
padding:9px 12px;
display:flex;
align-items:center;
gap:10px;
backdrop-filter:blur(12px);
}

.dock button{
flex:1;
padding:15px;
font-size:15px;
letter-spacing:.7px;
}

.dock span{
font-size:10px;
color:var(--muted);
}

footer{
text-align:center;
padding:18px;
color:var(--muted);
font-size:10px;
}

@media(max-width:650px){
.container{padding:8px}
.panel{padding:11px}
.market-row{grid-template-columns:1fr}
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{grid-template-columns:1fr 1fr}
.big-digit{font-size:clamp(78px,23vw,112px)}
.metric strong{font-size:16px}
}
</style>
</head>

<body>

<header>
<div class="logo">DERIV <span>INTELLIGENCE V3</span></div>
<div id="status" class
